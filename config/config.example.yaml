# Cyber TOR Professional v11.1.0
# Example configuration
# DO NOT PUT REAL SECRETS OR PRODUCTION CREDENTIALS HERE.

application:
  name: "Cyber TOR Professional"
  version: "11.1.0"
  edition: "Enterprise Advanced"
  environment: "development"

server:
  host: "127.0.0.1"
  port: 8787
  tls_enabled: false

security:
  session_timeout_minutes: 30
  csrf_protection: true
  audit_logging: true
  secure_headers: true

scope:
  enforcement: true
  require_explicit_authorization: true
  allow_private_networks: false
  allow_out_of_scope_targets: false

assessment:
  evidence_collection: true
  risk_scoring: true
  vulnerability_correlation: true
  attack_surface_tracking: true
  threat_intelligence: true

reporting:
  output_directory: "./reports"
  evidence_directory: "./state/evidence"
  format:
    - "json"
    - "html"

infrastructure:
  vault_enabled: true
  encryption_at_rest: true
  credentials_rendered_back: false

logging:
  level: "INFO"
  directory: "./state/logs"
  audit_log: "./state/audit.log"

integrations:
  cloudflare:
    enabled: false
    api_token: ""
  
  cpanel:
    enabled: false
    api_token: ""

  nmap:
    enabled: true
    binary: "nmap"

defensive:
  malware_indicator_analysis: true
  integrity_monitoring: true
  ransomware_activity_guard: true
  quarantine_enabled: false

development:
  debug: false
